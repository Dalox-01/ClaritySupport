# GitHub Actions Security Pipeline
# Comprehensive security scanning for every commit and pull request

name: 🔒 Security Audit Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security audit every Monday at 3 AM
    - cron: '0 3 * * 1'

jobs:
  # =====================================================
  # 1. DEPENDENCY VULNERABILITY SCANNING
  # =====================================================
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true
          npm audit --audit-level=moderate

      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json

      - name: Fail on critical vulnerabilities
        run: |
          CRITICAL=$(cat npm-audit.json | jq '.metadata.vulnerabilities.critical')
          HIGH=$(cat npm-audit.json | jq '.metadata.vulnerabilities.high')
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 3 ]; then
            echo "❌ CRITICAL or HIGH vulnerabilities found!"
            echo "Critical: $CRITICAL, High: $HIGH"
            exit 1
          fi

  # =====================================================
  # 2. SECRET SCANNING
  # =====================================================
  secret-scan:
    name: 🔑 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better secret detection

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          
          # Check for API keys
          if grep -r "sk-.*" --include="*.ts" --include="*.js" --exclude-dir=node_modules .; then
            echo "❌ Found potential OpenAI API key in code!"
            exit 1
          fi
          
          # Check for default encryption key
          if grep -r "default-32-char-encryption-key" --include="*.ts" --include="*.js" .; then
            echo "❌ Found hardcoded default encryption key!"
            exit 1
          fi
          
          echo "✅ No obvious secrets found in code"

  # =====================================================
  # 3. STATIC APPLICATION SECURITY TESTING (SAST)
  # =====================================================
  sast-scan:
    name: 🔬 SAST - Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: ESLint Security Plugin
        run: |
          npm ci
          npm install --save-dev eslint-plugin-security
          npx eslint . --ext .js,.ts,.tsx --plugin security --rule 'security/detect-object-injection: error'

  # =====================================================
  # 4. XSS VULNERABILITY DETECTION
  # =====================================================
  xss-detection:
    name: 🕷️ XSS Vulnerability Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for dangerouslySetInnerHTML
        run: |
          echo "🔍 Scanning for XSS-prone patterns..."
          
          DANGEROUS_HTML=$(grep -r "dangerouslySetInnerHTML" --include="*.tsx" --include="*.jsx" . | wc -l)
          INNER_HTML=$(grep -r "\.innerHTML\s*=" --include="*.js" --include="*.ts" . | wc -l)
          
          echo "Found $DANGEROUS_HTML uses of dangerouslySetInnerHTML"
          echo "Found $INNER_HTML uses of innerHTML assignment"
          
          if [ "$DANGEROUS_HTML" -gt 0 ] || [ "$INNER_HTML" -gt 0 ]; then
            echo "⚠️ WARNING: Found potential XSS vectors"
            echo "Ensure all HTML is sanitized with DOMPurify"
            
            # Check if sanitization is used
            SANITIZE_COUNT=$(grep -r "sanitizeHTML\|DOMPurify\.sanitize" --include="*.ts" --include="*.tsx" . | wc -l)
            
            if [ "$SANITIZE_COUNT" -eq 0 ]; then
              echo "❌ No HTML sanitization found!"
              exit 1
            fi
          fi

  # =====================================================
  # 5. CSRF PROTECTION VERIFICATION
  # =====================================================
  csrf-check:
    name: 🛡️ CSRF Protection Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify CSRF implementation
        run: |
          echo "🔍 Checking CSRF protection..."
          
          # Check if CSRF middleware exists
          if [ ! -f "lib/csrf.ts" ] && [ ! -f "lib/csrf.js" ]; then
            echo "❌ CSRF protection module not found!"
            exit 1
          fi
          
          # Check if middleware uses CSRF
          if ! grep -q "csrf" middleware.ts; then
            echo "❌ CSRF not implemented in middleware!"
            exit 1
          fi
          
          echo "✅ CSRF protection appears to be implemented"

  # =====================================================
  # 6. AUTHORIZATION CHECKS (IDOR Prevention)
  # =====================================================
  authorization-check:
    name: 🔐 Authorization & IDOR Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for IDOR vulnerabilities
        run: |
          echo "🔍 Scanning for potential IDOR vulnerabilities..."
          
          # Check for database queries without user_id filter
          SUSPICIOUS_QUERIES=$(grep -r "\.eq\('id'," app/api --include="*.ts" | grep -v "\.eq\('user_id'" | wc -l)
          
          if [ "$SUSPICIOUS_QUERIES" -gt 0 ]; then
            echo "⚠️ WARNING: Found $SUSPICIOUS_QUERIES potential IDOR vulnerabilities"
            echo "Ensure all resource access includes ownership verification"
            grep -r "\.eq\('id'," app/api --include="*.ts" | grep -v "\.eq\('user_id'"
          fi

  # =====================================================
  # 7. SECURITY HEADER VALIDATION
  # =====================================================
  security-headers:
    name: 🔒 Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check security headers in middleware
        run: |
          echo "🔍 Validating security headers..."
          
          REQUIRED_HEADERS=(
            "X-Content-Type-Options"
            "X-Frame-Options"
            "Strict-Transport-Security"
            "Content-Security-Policy"
            "Referrer-Policy"
          )
          
          for header in "${REQUIRED_HEADERS[@]}"; do
            if ! grep -q "$header" middleware.ts; then
              echo "❌ Missing security header: $header"
              exit 1
            fi
          done
          
          # Check CSP doesn't allow unsafe-eval or unsafe-inline for scripts
          if grep -q "'unsafe-eval'" middleware.ts || grep -q "'unsafe-inline'.*script" middleware.ts; then
            echo "❌ CSP allows unsafe directives!"
            exit 1
          fi
          
          echo "✅ All required security headers present"

  # =====================================================
  # 8. INTEGRATION TESTS (Security Focused)
  # =====================================================
  security-tests:
    name: 🧪 Security Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: |
          npm run test:security || echo "No security tests configured yet"

  # =====================================================
  # 9. DOCKER IMAGE SECURITY SCAN
  # =====================================================
  docker-scan:
    name: 🐳 Docker Image Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t security-scan:latest .

      - name: Run Trivy vulnerability scanner
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'security-scan:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('Dockerfile') != ''
        with:
          sarif_file: 'trivy-results.sarif'

  # =====================================================
  # 10. SECURITY REPORT GENERATION
  # =====================================================
  security-report:
    name: 📊 Generate Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, sast-scan, xss-detection, csrf-check, authorization-check, security-headers]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate security summary
        run: |
          echo "# 🔒 Security Audit Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Date:** $(date)" >> security-summary.md
          echo "**Commit:** ${{ github.sha }}" >> security-summary.md
          echo "" >> security-summary.md
          
          echo "## Scan Results" >> security-summary.md
          echo "- ✅ Dependency Scan: Completed" >> security-summary.md
          echo "- ✅ Secret Scan: Completed" >> security-summary.md
          echo "- ✅ SAST Analysis: Completed" >> security-summary.md
          echo "- ✅ XSS Detection: Completed" >> security-summary.md
          echo "- ✅ CSRF Check: Completed" >> security-summary.md
          echo "- ✅ Authorization Check: Completed" >> security-summary.md
          echo "- ✅ Security Headers: Validated" >> security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

  # =====================================================
  # 11. NOTIFY ON CRITICAL ISSUES
  # =====================================================
  notify:
    name: 📢 Notify Security Team
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, sast-scan]
    if: failure() && github.event_name == 'push'
    steps:
      - name: Send notification
        run: |
          echo "🚨 SECURITY ALERT: Critical vulnerabilities detected in commit ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          
          # In production, send to Slack/Discord/Email
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"🚨 Security vulnerabilities detected in '"${{ github.repository }}"'"}'
